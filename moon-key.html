<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>靈魂地圖・付款完成</title>
<style>
  :root{
    --pink:#e0748c;
    --gold:#c9a15a;
    --light-gold:#faf3e6;
    --light-pink:#fdf1f3;
    --gray:#8a8380;
    --dark:#3a332f;
    --radius:18px;
    --radius-sm:12px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, var(--light-pink), var(--light-gold));
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color:var(--dark);
    padding:24px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:var(--radius);
    padding:32px 28px;
    box-shadow:0 12px 32px rgba(0,0,0,0.08);
    text-align:center;
  }
  .emoji{ font-size:40px; margin-bottom:8px; }
  h1{
    font-size:20px;
    margin:0 0 12px;
    color:var(--dark);
  }
  p{
    font-size:14.5px;
    line-height:1.7;
    color:var(--gray);
    margin:0 0 20px;
  }
  button{
    width:100%;
    border:none;
    border-radius:999px;
    padding:14px 20px;
    font-size:16px;
    font-weight:600;
    background:linear-gradient(135deg, var(--pink), var(--gold));
    color:#fff;
    cursor:pointer;
    transition:opacity .2s;
  }
  button:disabled{ opacity:0.6; cursor:default; }
  .err{
    color:var(--pink);
    font-size:13.5px;
    margin-top:12px;
    min-height:18px;
  }
  .result{ display:none; }
  .result.show{ display:block; }
  .code-box{
    background:var(--light-gold);
    border:1px solid rgba(201,161,90,0.35);
    border-radius:var(--radius-sm);
    padding:16px;
    margin:8px 0 20px;
  }
  .code-label{
    font-size:12.5px;
    color:var(--gray);
    margin-bottom:6px;
  }
  .code-value{
    font-size:22px;
    font-weight:700;
    letter-spacing:1px;
    color:var(--dark);
    word-break:break-all;
  }
  .go-btn{
    display:block;
    text-decoration:none;
    text-align:center;
    width:100%;
    border-radius:999px;
    padding:14px 20px;
    font-size:16px;
    font-weight:600;
    background:linear-gradient(135deg, var(--pink), var(--gold));
    color:#fff;
    box-sizing:border-box;
  }
  .note{
    font-size:12.5px;
    color:var(--gray);
    margin-top:14px;
    line-height:1.6;
  }
  .email-input{
    width:100%;
    border:1px solid rgba(201,161,90,0.35);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    font-size:15px;
    margin-bottom:6px;
    color:var(--dark);
    background:var(--light-gold);
    box-sizing:border-box;
    font-family:inherit;
  }
  .email-input:focus{ outline:none; border-color:var(--pink); background:#fff; }
  .email-hint{
    font-size:12px;
    color:var(--gray);
    margin-bottom:16px;
    line-height:1.6;
    text-align:left;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🗺️</div>
    <h1>感謝你的支持！</h1>

    <div id="startBlock">
      <p>付款完成後，點下面按鈕產生你專屬的靈魂地圖完整版序號，就可以馬上開始聊了。</p>
      <input type="email" class="email-input" id="emailInput" placeholder="你的 Email" autocomplete="email" inputmode="email">
      <div class="email-hint">留一下 email，之後萬一忘記序號，我們才能幫你查回來喔。</div>
      <button id="claimBtn">產生我的序號</button>
      <div class="err" id="err"></div>
    </div>

    <div class="result" id="resultBlock">
      <p>你的序號已經產生好了，也幫你記起來了——之後不管在手機還是電腦上，重新輸入這組序號都可以接續之前聊過的內容，不會不見。</p>
      <div class="code-box">
        <div class="code-label">你的序號</div>
        <div class="code-value" id="codeValue">—</div>
      </div>
      <a class="go-btn" id="goBtn" href="#">立即開始聊天 →</a>
      <div class="note">建議先截圖或抄下這組序號留存，之後想繼續聊時，直接輸入這組序號就可以了。</div>
    </div>
  </div>

<script>
var CONFIG = {
  workerUrl: "https://soulmap-gemini-proxy.candyshe10.workers.dev/",
  claimSecret: "eY3dQT17Zjao4KKFDkAiKuX6w4J0GIcu",
  fullVersionUrl: "https://candyshe10-hue.github.io/full.html"
};

var claimBtn = document.getElementById("claimBtn");
var startBlock = document.getElementById("startBlock");
var resultBlock = document.getElementById("resultBlock");
var errEl = document.getElementById("err");
var codeValueEl = document.getElementById("codeValue");
var goBtn = document.getElementById("goBtn");
var emailInput = document.getElementById("emailInput");

function isValidEmail(v){
  // 簡單檢查格式就好，不用太嚴格，主要是擋掉明顯亂打或忘記填的狀況
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

claimBtn.addEventListener("click", function(){
  errEl.textContent = "";

  var email = emailInput.value.trim();
  if(!isValidEmail(email)){
    errEl.textContent = "請留一個正確的 Email，之後忘記序號才找得到你喔。";
    emailInput.focus();
    return;
  }

  claimBtn.disabled = true;
  claimBtn.textContent = "產生中…";

  fetch(CONFIG.workerUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      client_action: "claim_code",
      claim_secret: CONFIG.claimSecret,
      email: email
    })
  })
  .then(function(res){
    if(!res.ok){
      var e = new Error("claim_failed");
      e.status = res.status;
      throw e;
    }
    return res.json();
  })
  .then(function(data){
    if(data && data.code){
      codeValueEl.textContent = data.code;
      goBtn.href = CONFIG.fullVersionUrl + "?code=" + encodeURIComponent(data.code);
      startBlock.style.display = "none";
      resultBlock.classList.add("show");
    } else {
      throw new Error("no_code");
    }
  })
  .catch(function(err){
    claimBtn.disabled = false;
    claimBtn.textContent = "產生我的序號";
    errEl.textContent = "剛剛好像出了點狀況，可以再按一次試試看，或加官方 LINE（https://lin.ee/OyVrggK）告訴我們喔。";
  });
});
</script>
</body>
</html>
